<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Results summary component</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="summary-results">
        <div class="results">
          <h1>Your Result</h1>
          <div>
            <div class="rate">
              <div>
                <h2>76</h2>
                <span>of 100</span>
              </div>
            </div>
          </div>
          <h3>Great</h3>
          <p>
            You scored higher than 65% of the people who have taken these tests.
          </p>
        </div>
        <div class="summary">
          <h1>Summary</h1>
          <div class="sum-statist reaction">
            <div class="statist">
              <img src="images/icon-reaction.svg" alt="reaction" />
              <h4>Reaction</h4>
            </div>
            <h5>80 <span> / 100</span></h5>
          </div>
          <div class="sum-statist memory ">
            <div class="statist">
              <img src="images/icon-memory.svg" alt="memory" />
              <h4>Memory</h4>
            </div>
            <h5>92 <span> / 100</span></h5>
          </div>
          <div class="sum-statist verbal">
            <div class="statist">
              <img src="images/icon-verbal.svg" alt="verbal" />
              <h4>Verbal</h4>
            </div>
            <h5>61 <span> / 100</span></h5>
          </div>
          <div class="sum-statist visual">
            <div class="statist">
              <img src="images/icon-visual.svg" alt="visual" />
              <h4>Visual</h4>
            </div>
            <h5>73 <span> / 100</span></h5>
          </div>
          <button>Continue</button>
        </div>
      </div>
    </main>
  </body>
</html>
